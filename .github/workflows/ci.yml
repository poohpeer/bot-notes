name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: uv sync --extra heavy

      - run: uv run ruff check .
      - run: uv run ruff format --check .

      - run: uv run pytest -q
        env:
          TELEGRAM_BOT_TOKEN: test-token
          DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/postgres
          REDIS_URL: redis://localhost:6379/0
          EMBEDDINGS_URL: http://localhost:9
          EMBEDDING_MODEL_NAME: test-model

      # The real proof M0 asks for: `alembic upgrade head` on a target
      # database — see docs/architecture/08-roadmap.md, M0 "Готово, когда".
      # Round-tripped through downgrade too, so a broken `downgrade()` (the
      # compatibility rule in 06-deployment.md depends on it working) fails
      # CI instead of surfacing during a rollback.
      - run: uv run alembic upgrade head
        env:
          TELEGRAM_BOT_TOKEN: test-token
          DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/postgres
      - run: uv run alembic downgrade base
        env:
          TELEGRAM_BOT_TOKEN: test-token
          DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/postgres
      - run: uv run alembic upgrade head
        env:
          TELEGRAM_BOT_TOKEN: test-token
          DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/postgres

  build:
    needs: test
    if: ${{ github.event_name != 'pull_request' && !cancelled() && needs.test.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [app, app-heavy]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v<run number>-<target> mirrors the numbered-tag convention used by
      # the neighboring bot-organizer deployment: unique per build, ordered,
      # and the tag actually rolled out to the cluster — :latest is for
      # pulling by hand.
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}-${{ matrix.target }}:v${{ github.run_number }}
            ${{ env.IMAGE_NAME }}-${{ matrix.target }}:latest
            ${{ env.IMAGE_NAME }}-${{ matrix.target }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # No deploy job yet: M0 ships a migration Job and a ConfigMap, not a
  # running bot. A deploy job mirroring bot-organizer's (self-hosted runner,
  # rollout wait, log-based verification) lands with M2, once notes-bot and
  # notes-worker-fast are real Deployments with something to verify.
