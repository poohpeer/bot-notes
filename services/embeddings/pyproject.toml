[project]
name = "notes-embeddings"
version = "0.1.0"
description = "Embedding service for notes-bot — see docs/architecture/05-contracts.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sentence-transformers>=3.1",
    "torch>=2.4",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# The service only ever runs model.encode() on CPU (see main.py — no
# nvidia.com/gpu resource is ever requested, homelab has no GPU either).
# PyPI's default torch wheel bundles the full CUDA runtime regardless
# (~9GB of nvidia-* libraries never touched), which is most of why the
# built image was 11GB+ and took over 10 minutes to pull on a home
# connection. This index carries CPU-only wheels instead.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/embeddings_service"]
