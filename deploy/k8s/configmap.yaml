# Non-secret configuration — see docs/architecture/05-contracts.md,
# "Конфигурация", and 06-deployment.md, "Секреты и сеть".
apiVersion: v1
kind: ConfigMap
metadata:
  name: notes-bot-config
data:
  EMBEDDINGS_URL: "http://notes-embeddings:8000"
  EMBEDDING_DIM: "768"
  EMBEDDING_MODEL_NAME: "intfloat/multilingual-e5-base"
  # ai-proxy has no auth and is not exposed outside the cluster; this is an
  # internal ClusterIP address, not a secret. Assumes the same namespace as
  # ai-proxy — otherwise use the namespaced FQDN, see 05-contracts.md.
  PROXY_AI_URL: "http://ai-proxy:8787"
  # The ai-proxy codex sandbox fix this was blocked on (ADR-14, risk R5 in
  # docs/architecture/07-decisions.md) has shipped — ai-proxy#15 merged and
  # deployed. Enabled: title/tags/summary/duplicate enrichment and
  # /smart_search's synthesized answer now actually call ai-proxy.
  LLM_ENABLED: "true"
  LLM_ENRICH_TIMEOUT_S: "120"
  LLM_SMART_SEARCH_TIMEOUT_S: "180"
  WHISPER_MODEL: "small"
  MAX_AUDIO_SECONDS: "1200"
  MAX_DOWNLOAD_BYTES: "104857600"
  SEARCH_CANDIDATE_K: "200"
  SEARCH_PAGE_SIZE: "5"
  LOG_LEVEL: "INFO"
  HEALTH_PORT: "8080"
  GC_RETENTION_DAYS: "30"
  GC_STUCK_PROCESSING_MINUTES: "30"
  GC_BATCH_SIZE: "500"
  # A note reclaimed this many times without reaching 'done' is abandoned
  # instead — see Settings.gc_max_attempts.
  GC_MAX_ATTEMPTS: "3"
  # `heavy`'s own RQ job_timeout — see Settings.heavy_job_timeout_s for why
  # RQ's 180s default is too tight for it.
  HEAVY_JOB_TIMEOUT_S: "900"
  ALERTS_MIN_INTERVAL_MINUTES: "5"
  # notes-worker-fast/-heavy's Prometheus port — notes-bot itself serves
  # /metrics on HEALTH_PORT instead, see health.py.
  METRICS_PORT: "9090"
