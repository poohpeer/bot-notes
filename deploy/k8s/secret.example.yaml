# Copy to secret.yaml, fill in real values, `kubectl apply -f`. secret.yaml
# is gitignored — never commit real tokens. See 06-deployment.md, "Секреты и
# сеть": DATABASE_URL points at a role/schema of the shared family-bot
# Postgres with its own, non-overlapping privileges.
apiVersion: v1
kind: Secret
metadata:
  name: notes-bot-secrets
type: Opaque
stringData:
  TELEGRAM_BOT_TOKEN: "123456:REPLACE_ME"
  DATABASE_URL: "postgresql+psycopg://notes_bot:REPLACE_ME@postgres:5432/family_bot"
  REDIS_URL: "redis://redis:6379/3"
  # Ops alerts (a stuck/abandoned/failed note) — see clients/alerts.py. Can
  # point at the same bot/chat as ai-proxy's AI_PROXY_TELEGRAM_* (its own,
  # separate pair of settings — the two services are deployed independently).
  # Both empty turns alerts off rather than failing to start.
  ALERTS_TELEGRAM_BOT_TOKEN: ""
  ALERTS_TELEGRAM_CHAT_ID: ""
