# notes-gc — daily hard-delete + stuck-processing reclaim, see
# docs/architecture/08-roadmap.md M8 and 03-ingest.md. Runs the `notes-app`
# image (no ffmpeg/whisper needed) via `notes_bot.cli.gc`.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: notes-gc
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      # Both phases page through their work in bounded batches (GC_BATCH_SIZE)
      # rather than one long transaction — see 07-decisions.md R7 — so a
      # generous but still bounded deadline is enough even on a large table.
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: notes-bot-ghcr-pull-secret
          containers:
            - name: gc
              image: ghcr.io/poohpeer/bot-notes-app:latest
              command: ["uv", "run", "--no-sync", "python", "-m", "notes_bot.cli.gc"]
              envFrom:
                - configMapRef:
                    name: notes-bot-config
                - secretRef:
                    name: notes-bot-secrets
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
