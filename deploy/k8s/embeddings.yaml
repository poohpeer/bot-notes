# notes-embeddings — see docs/architecture/06-deployment.md and
# 05-contracts.md. Scaled by replica, never by process (workers=1 in the
# image's uvicorn command) — several processes would mean several copies of
# the ~1GB model in one pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-embeddings
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notes-embeddings
  template:
    metadata:
      labels:
        app: notes-embeddings
    spec:
      imagePullSecrets:
        - name: notes-bot-ghcr-pull-secret
      containers:
        - name: embeddings
          image: ghcr.io/poohpeer/bot-notes-embeddings:latest
          # PyTorch sizes its thread pool from the *host's* CPU count, blind
          # to the cgroup limit below — on a shared node that means far more
          # threads than the container can actually run at once, causing
          # scheduling thrash that pushes inference past
          # EMBEDDINGS_QUEUE_TIMEOUT_S (429 "at capacity") even with no real
          # concurrent load. Pin the thread pool to the CPU limit instead.
          #
          # EMBEDDINGS_QUEUE_TIMEOUT_S=30: the default (10s) was tuned
          # against a single short string; a real note can batch up to
          # EMBEDDINGS_MAX_BATCH_SIZE=64 chunks (a long YouTube transcript,
          # in practice) in one call, and that genuinely takes longer than
          # 10s on this CPU budget — observed timing out 3 times running
          # against real traffic even with the thread pinning above.
          env:
            - name: OMP_NUM_THREADS
              value: "3"
            - name: MKL_NUM_THREADS
              value: "3"
            - name: EMBEDDINGS_QUEUE_TIMEOUT_S
              value: "30"
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              # 3000m, not 1500m: the node has 8 idle cores (homelab kind
              # cluster, single tenant) and a real batch of chunks is
              # genuinely compute-bound here, not just badly scheduled —
              # more headroom shortens the batch itself, where the timeout
              # bump above only tolerates it.
              cpu: 3000m
              memory: 2560Mi
          # Loading the model from disk takes tens of seconds; startupProbe
          # keeps liveness from firing during that window instead of racing
          # initialDelaySeconds against it — see 06-deployment.md.
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: notes-embeddings
spec:
  selector:
    app: notes-embeddings
  ports:
    - port: 8000
      targetPort: 8000
---
# Only the bot and the workers may reach it — it is never exposed outside
# the cluster, see 06-deployment.md, "Секреты и сеть".
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: notes-embeddings-allow-app-only
spec:
  podSelector:
    matchLabels:
      app: notes-embeddings
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: notes-bot
        - podSelector:
            matchLabels:
              app: notes-worker-fast
        - podSelector:
            matchLabels:
              app: notes-worker-heavy
      ports:
        - port: 8000
